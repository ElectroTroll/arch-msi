# Modo oscuro para las aplicaciones GTK4.
#
# El escritorio (Waybar, rofi, kitty, dunst...) ya era oscuro: lo pinta matugen
# desde `mode = "dark"` de theme/tokens.toml. Esto es para las APLICACIONES, que
# van por otro camino y se quedaban en claro.
#
# QUIÉN LEE QUÉ. Lo que siguen casi todas las apps modernas —Firefox, Electron,
# GTK4/libadwaita, Qt 6— no es este archivo, sino la preferencia
# `org.freedesktop.appearance color-scheme` que publica xdg-desktop-portal-gtk
# a partir de la clave gsettings `org.gnome.desktop.interface color-scheme`.
# Esa la fija `theme-apply` en cada arranque, porque vive en dconf (una base de
# datos binaria) y no se puede versionar como archivo.
#
# Este settings.ini cubre el hueco que deja aquello: las apps **GTK4** que no
# consultan el portal y solo miran su propia configuración.
[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita-dark
