# kitty.conf — MSI Summit E16 AI Studio (arch-msi)
# Fecha: 2026-08-27 · Tarea 3.1 (Kitty), sobre la arquitectura de tema de la 3.0.
# Verificado con kitty 0.48.2.
#
# AQUÍ VA EL COMPORTAMIENTO; el aspecto viene generado.
#
# Colores, tipografía y transparencia los pone matugen en `theme.conf`, que es
# un ARTEFACTO: archivo real junto a este enlace, fuera del repositorio y fuera
# de Stow. La plantilla que lo genera sí está versionada, en
# dotfiles/matugen/.config/matugen/templates/kitty-theme.conf, y los valores
# salen de theme/tokens.toml.
#
# El `include` va AL PRINCIPIO a propósito: kitty aplica las directivas en
# orden, así que lo de abajo puede sobrescribir puntualmente algo del tema si
# alguna vez hace falta. Al revés no funcionaría.
#
# ⚠️ La ruta es relativa, y aquí SÍ vale: kitty resuelve los `include` respecto
# al directorio de la config que los contiene, no respecto al destino del
# enlace. (En hyprlock hubo que poner ruta absoluta justo por lo contrario.)
include theme.conf


# --- Ventana ------------------------------------------------------------------
# Sin barra de pestañas cuando solo hay una: Hyprland ya gestiona las ventanas y
# una pestaña única es una fila de píxeles desperdiciada.
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style slanted

# Margen interior. Con fondo translúcido el texto pegado al borde se lee peor
# sobre lo que haya detrás.
window_padding_width 8

# Sin campana audible: las notificaciones son cosa de dunst.
enable_audio_bell no

# Confirmar al cerrar solo si queda algo corriendo de verdad.
confirm_os_window_close -1


# --- Desplazamiento -----------------------------------------------------------
scrollback_lines 10000

# Abre el historial en el paginador del sistema; sin esto kitty usa `less` con
# opciones propias que se comen el color.
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER


# --- Cursor -------------------------------------------------------------------
cursor_shape beam
cursor_blink_interval 0


# --- Teclado ------------------------------------------------------------------
# El portapapeles del sistema, no el de X11 de toda la vida.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Tamaño de letra al vuelo.
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0
