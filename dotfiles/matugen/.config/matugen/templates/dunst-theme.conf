# 50-theme.conf — PLANTILLA del drop-in de tema de dunst (arch-msi)
#
# Fuente:  dotfiles/matugen/.config/matugen/templates/dunst-theme.conf   (esto)
# Salida:  ~/.config/dunst/dunstrc.d/50-theme.conf                       (artefacto)
#
# ⚠️ NO EDITAR la salida: la reescribe matugen en cada arranque. Se edita este
# archivo, o theme/tokens.toml para los valores.
#
# POR QUÉ UN DROP-IN Y NO REESCRIBIR dunstrc. dunst lee, además de su config
# base, los archivos de ~/.config/dunst/dunstrc.d/*.conf y aplica sus ajustes
# ENCIMA (man dunst, sección FILES). Eso permite que `dunstrc` siga siendo un
# archivo versionado y enlazado por Stow —con toda la lógica de comportamiento,
# atajos y reglas— y que el tema entre por un archivo aparte que nadie versiona.
# Waybar necesitó lo contrario porque GTK CSS no tiene variables; aquí no hace
# falta, así que no se toca lo que ya funciona.
#
# El número 50 del nombre marca el orden: los drop-ins se aplican en orden
# alfabético, así que uno futuro con prefijo mayor (60-…) podría sobrescribir
# esto a propósito.

[global]
    font = {{font_family}} {{font_size_base_pt}}

    corner_radius = {{metrics_radius}}
    frame_width = {{metrics_border}}
    padding = {{metrics_pad_lg}}
    horizontal_padding = {{metrics_pad_xl}}
    gap_size = {{metrics_gap}}

    # ⚠️ AQUÍ NO VA `transparency`. Su manual la marca como "(X11 only)" y esta
    # sesión es Wayland: la clave se acepta sin protestar y NO HACE NADA. Se
    # probó el 2026-08-27 con transparency = 25 y las notificaciones seguían
    # opacas, sin un solo aviso en el journal. Fallo silencioso de manual.
    #
    # En Wayland la transparencia va en el CANAL ALFA del color (#RRGGBBAA), y
    # por eso los `background` de abajo llevan el sufijo que calcula
    # theme-apply.sh a partir de [opacity].surface — el mismo 0.75 de la barra.

    # Relleno de la barra de progreso: el acento del tema.
    highlight = "{{accent}}"

# --- Urgencias --------------------------------------------------------------
# El FONDO es siempre el mismo y lo que cambia es el MARCO: es la decisión de la
# tarea 2.2 y se mantiene, solo que ahora los colores salen del tema.
#
# Los fondos llevan alfa; los MARCOS no, a propósito: un borde translúcido se
# lee peor y es justo lo que distingue una urgencia de otra.
#
# Baja y normal siguen al fondo de pantalla; la CRÍTICA no. Su marco es fijo
# porque una notificación urgente tiene que leerse como urgente con cualquier
# wallpaper (ver [colors.state] en theme/tokens.toml).

[urgency_low]
    background = "{{colors.surface.default.hex}}{{opacity_surface_hex}}"
    foreground = "{{colors.outline_variant.default.hex}}"
    frame_color = "{{colors.surface_container_high.default.hex}}"

[urgency_normal]
    background = "{{colors.surface.default.hex}}{{opacity_surface_hex}}"
    foreground = "{{colors.on_surface.default.hex}}"
    frame_color = "{{accent}}"

[urgency_critical]
    background = "{{colors.surface.default.hex}}{{opacity_surface_hex}}"
    foreground = "{{colors.on_surface.default.hex}}"
    frame_color = "{{state_crit}}"
