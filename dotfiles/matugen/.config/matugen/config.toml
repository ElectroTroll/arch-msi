# config.toml — matugen · MSI Summit E16 AI Studio (arch-msi)
# Fecha: 2026-08-27 · Tarea 3.0 (tema centralizado).
# Verificado con matugen 4.2.0-1 (repositorio `extra`, NO el AUR).
#
# ESTE ARCHIVO NO SE EDITA PARA CAMBIAR EL ASPECTO. Aquí solo se declara QUÉ
# plantilla va a QUÉ ruta. El esquema, el contraste, el tono del acento, la
# fuente y las métricas viven en theme/tokens.toml, que es el único archivo que
# se toca; `scripts/theme-apply.sh` los pasa como argumentos y como render data.
#
# ⚠️ REGLA DE ORO — `output_path` NUNCA puede apuntar a un archivo gestionado por
# Stow. Los enlaces de ~/.config/{waybar,dunst,hypr} apuntan DENTRO del
# repositorio: escribir sobre uno de ellos metería la salida generada en el repo
# (o rompería el enlace). Toda salida usa nombres NUEVOS que no existen en el
# repo, en directorios reales. Ver docs/PROJECT_CONTEXT.md.
#
# ⚠️ NO añadir aquí `[config.wallpaper]` con `set = true`: el fondo lo gobierna
# hyprpaper (tarea 2.4) y matugen no debe tocarlo. Tampoco recargas de apps: las
# hace theme-apply.sh, que sabe qué señal necesita cada una.

[config]

# Waybar: se genera la hoja ENTERA, no solo los colores. GTK CSS no tiene
# variables numéricas, así que es la única forma de que la fuente y las métricas
# salgan de theme/tokens.toml. Por eso `style.css` ya NO lo enlaza Stow: la
# plantilla es lo versionado y la hoja es artefacto. Ver la cabecera de la
# plantilla.
[templates.waybar]
input_path  = "~/.config/matugen/templates/waybar-style.css"
output_path = "~/.config/waybar/style.css"

# La config también, porque la altura de la barra y el margen del CSS son dos
# mitades del mismo cálculo de la isla flotante.
[templates.waybar-config]
input_path  = "~/.config/matugen/templates/waybar-config.jsonc"
output_path = "~/.config/waybar/config.jsonc"

# dunst SÍ conserva su dunstrc enlazado por Stow: el tema entra como drop-in,
# que dunst aplica encima de la config base (man dunst, FILES).
[templates.dunst]
input_path  = "~/.config/matugen/templates/dunst-theme.conf"
output_path = "~/.config/dunst/dunstrc.d/50-theme.conf"

# hyprlock conserva su hyprlock.conf enlazado por Stow y hace `source` de este
# archivo, que solo trae variables de hyprlang.
[templates.hyprlock]
input_path  = "~/.config/matugen/templates/hyprlock-theme.conf"
output_path = "~/.config/hypr/theme.conf"

# kitty conserva su kitty.conf enlazado por Stow y hace `include theme.conf`.
[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty-theme.conf"
output_path = "~/.config/kitty/theme.conf"

# Hyprland: hyprland.lua carga este archivo con `dofile` y usa la tabla.
[templates.hyprland]
input_path  = "~/.config/matugen/templates/hyprland-theme.lua"
output_path = "~/.config/hypr/theme.lua"

# fastfetch: config ENTERA generada. No admite incluir un segundo archivo
# ("Error: only one config file can be loaded"), así que no puede seguir el
# patrón de dunst/kitty y no tiene paquete Stow propio.
[templates.fastfetch]
input_path  = "~/.config/matugen/templates/fastfetch-config.jsonc"
output_path = "~/.config/fastfetch/config.jsonc"

# wlogout: como Waybar, GTK CSS no tiene variables numéricas, así que se genera
# la hoja entera y `style.css` sale de Stow. El `layout` no es temático y sigue
# enlazado.
#
# ⚠️ Su ~/.config/wlogout estaba enlazado como DIRECTORIO COMPLETO, con lo que
# este artefacto habría acabado dentro del repositorio. Se reconvirtió a enlaces
# por archivo el 2026-08-28 con `stow -D wlogout && stow --no-folding wlogout`.
[templates.wlogout]
input_path  = "~/.config/matugen/templates/wlogout-style.css"
output_path = "~/.config/wlogout/style.css"

# rofi: conserva su config.rasi enlazada por Stow y la cierra con
# `?import "theme"`. El lenguaje .rasi tiene variables reutilizables, así que
# sigue el patrón de dunst/hyprlock/kitty y no el de Waybar.
#
# ⚠️ El artefacto se llama `theme.rasi` y ese nombre NO existe en el repositorio,
# que es lo que mantiene la regla de oro. Y hay una segunda red: comprobado el
# 2026-08-28 que rofi resuelve sus `?import` junto al ENLACE, no junto al
# destino del enlace, así que este import no puede leer nada de dentro del repo
# ni aunque algún día apareciera ahí un archivo con este nombre.
[templates.rofi]
input_path  = "~/.config/matugen/templates/rofi-theme.rasi"
output_path = "~/.config/rofi/theme.rasi"
