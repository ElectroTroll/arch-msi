# config.toml — matugen · MSI Summit E16 AI Studio (arch-msi)
# Fecha: 2026-08-27 · Tarea 3.0 (tema centralizado).
# Verificado con matugen 4.2.0-1 (repositorio `extra`, NO el AUR).
#
# ESTE ARCHIVO NO SE EDITA PARA CAMBIAR EL ASPECTO. Aquí solo se declara QUÉ
# plantilla va a QUÉ ruta. El esquema, el contraste, el tono del acento, la
# fuente y las métricas viven en theme/tokens.toml, que es el único archivo que
# se toca; `scripts/theme-apply.sh` los pasa como argumentos y como render data.
#
# ⚠️ REGLA DE ORO — `output_path` NUNCA puede apuntar a un archivo gestionado por
# Stow. Los enlaces de ~/.config/{waybar,dunst,hypr} apuntan DENTRO del
# repositorio: escribir sobre uno de ellos metería la salida generada en el repo
# (o rompería el enlace). Toda salida usa nombres NUEVOS que no existen en el
# repo, en directorios reales. Ver docs/PROJECT_CONTEXT.md.
#
# ⚠️ NO añadir aquí `[config.wallpaper]` con `set = true`: el fondo lo gobierna
# hyprpaper (tarea 2.4) y matugen no debe tocarlo. Tampoco recargas de apps: las
# hace theme-apply.sh, que sabe qué señal necesita cada una.

[config]

# Waybar: se genera la hoja ENTERA, no solo los colores. GTK CSS no tiene
# variables numéricas, así que es la única forma de que la fuente y las métricas
# salgan de theme/tokens.toml. Por eso `style.css` ya NO lo enlaza Stow: la
# plantilla es lo versionado y la hoja es artefacto. Ver la cabecera de la
# plantilla.
[templates.waybar]
input_path  = "~/.config/matugen/templates/waybar-style.css"
output_path = "~/.config/waybar/style.css"

# La config también, porque la altura de la barra y el margen del CSS son dos
# mitades del mismo cálculo de la isla flotante.
[templates.waybar-config]
input_path  = "~/.config/matugen/templates/waybar-config.jsonc"
output_path = "~/.config/waybar/config.jsonc"

# dunst SÍ conserva su dunstrc enlazado por Stow: el tema entra como drop-in,
# que dunst aplica encima de la config base (man dunst, FILES).
[templates.dunst]
input_path  = "~/.config/matugen/templates/dunst-theme.conf"
output_path = "~/.config/dunst/dunstrc.d/50-theme.conf"

# hyprlock conserva su hyprlock.conf enlazado por Stow y hace `source` de este
# archivo, que solo trae variables de hyprlang.
[templates.hyprlock]
input_path  = "~/.config/matugen/templates/hyprlock-theme.conf"
output_path = "~/.config/hypr/theme.conf"

# SDDM: el greeter NO lee de aquí. Este artefacto es un paso intermedio que
# `greeter-apply` copia luego a /usr/share/sddm/themes/arch-msi/ CON SUDO,
# porque el usuario `sddm` no puede leer /home/elok (drwx------). Por eso el
# greeter es el único componente del tema que no se actualiza solo. Ver
# PROJECT_CONTEXT §24.
#
# ⚠️ El directorio de salida es NUEVO y no existe en el repositorio, que es lo
# que mantiene la regla de oro: ninguna salida puede caer sobre un enlace de
# Stow.
[templates.sddm]
input_path  = "~/.config/matugen/templates/sddm-theme.conf"
output_path = "~/.config/sddm-arch-msi/theme.conf"

# kitty conserva su kitty.conf enlazado por Stow y hace `include theme.conf`.
[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty-theme.conf"
output_path = "~/.config/kitty/theme.conf"

# Hyprland: hyprland.lua carga este archivo con `dofile` y usa la tabla.
[templates.hyprland]
input_path  = "~/.config/matugen/templates/hyprland-theme.lua"
output_path = "~/.config/hypr/theme.lua"

# fastfetch: config ENTERA generada. No admite incluir un segundo archivo
# ("Error: only one config file can be loaded"), así que no puede seguir el
# patrón de dunst/kitty y no tiene paquete Stow propio.
[templates.fastfetch]
input_path  = "~/.config/matugen/templates/fastfetch-config.jsonc"
output_path = "~/.config/fastfetch/config.jsonc"

# wlogout: como Waybar, GTK CSS no tiene variables numéricas, así que se genera
# la hoja entera y `style.css` sale de Stow. El `layout` no es temático y sigue
# enlazado.
#
# ⚠️ Su ~/.config/wlogout estaba enlazado como DIRECTORIO COMPLETO, con lo que
# este artefacto habría acabado dentro del repositorio. Se reconvirtió a enlaces
# por archivo el 2026-08-28 con `stow -D wlogout && stow --no-folding wlogout`.
[templates.wlogout]
input_path  = "~/.config/matugen/templates/wlogout-style.css"
output_path = "~/.config/wlogout/style.css"

# rofi: conserva su config.rasi enlazada por Stow y la cierra con
# `?import "theme"`. El lenguaje .rasi tiene variables reutilizables, así que
# sigue el patrón de dunst/hyprlock/kitty y no el de Waybar.
#
# ⚠️ El artefacto se llama `theme.rasi` y ese nombre NO existe en el repositorio,
# que es lo que mantiene la regla de oro. Y hay una segunda red: comprobado el
# 2026-08-28 que rofi resuelve sus `?import` junto al ENLACE, no junto al
# destino del enlace, así que este import no puede leer nada de dentro del repo
# ni aunque algún día apareciera ahí un archivo con este nombre.
[templates.rofi]
input_path  = "~/.config/matugen/templates/rofi-theme.rasi"
output_path = "~/.config/rofi/theme.rasi"

# yazi: conserva `yazi.toml` y `keymap.toml` enlazados por Stow, y el tema va
# entero generado, como la hoja de Waybar. NO es porque a yazi le falte una vía
# de importación —tiene `[flavor]`—, sino porque su `theme.toml` no contiene
# nada de comportamiento: eso vive en `yazi.toml`. Al no haber qué separar, un
# flavor solo añadiría un archivo puntero.
#
# ⚠️ Su `theme.toml` es una capa PARCIAL sobre el preset compilado en el
# binario, así que la plantilla solo declara el cromo. Los colores por tipo de
# archivo y los de permisos siguen saliendo de los ANSI de kitty, que ya son los
# del proyecto: redeclararlos aquí sería duplicar. Ver la cabecera de la
# plantilla.
#
# ⚠️ El artefacto se llama `theme.toml` y ese nombre NO existe en el repositorio
# (el paquete Stow `yazi` solo trae `yazi.toml` y `keymap.toml`), que es lo que
# mantiene la regla de oro.
[templates.yazi]
input_path  = "~/.config/matugen/templates/yazi-theme.toml"
output_path = "~/.config/yazi/theme.toml"

# Neovim: conserva su `init.lua` enlazado por Stow y carga este artefacto con
# `dofile`, igual que Hyprland con su theme.lua. Sigue el patrón de
# dunst/kitty/hyprlock —config versionada + fragmento de tema generado— y no el
# de Waybar, porque en init.lua sí hay comportamiento que separar del color.
#
# ⚠️ El artefacto se llama `theme.lua` y ese nombre NO existe en el repositorio
# (el paquete Stow `nvim` solo trae `init.lua`), que es lo que mantiene la regla
# de oro. Y hay una segunda red: ~/.config/nvim se enlazó con `--no-folding`, o
# sea que es un directorio REAL. Con un `stow nvim` normal sería un enlace al
# repositorio y este archivo acabaría versionado —el fallo de wlogout del
# 2026-08-28—. Si algún día `git status` muestra un theme.lua sin seguimiento
# dentro de dotfiles/nvim/, es que alguien volvió a plegar el paquete.
#
# ⚠️ NO hay recarga en theme-apply para Neovim, y es a propósito: init.lua lee
# este archivo AL ARRANCAR. Las instancias ya abiertas conservan los colores
# viejos hasta que se reinician, que para un editor es comportamiento aceptable
# —a diferencia de la barra, que debe cuadrar con el fondo al instante—.
[templates.nvim]
input_path  = "~/.config/matugen/templates/nvim-theme.lua"
output_path = "~/.config/nvim/theme.lua"

# ZapZap (WhatsApp Web). La salida va a los datos de la APLICACIÓN, no a
# ~/.config: ZapZap lee de ahí los CSS de «personalización avanzada» y los
# inyecta en la página. No es ruta de Stow, así que la regla de oro se cumple.
#
# ⚠️ Esto pisa variables internas de WhatsApp Web, que NO son una API pública.
# Si Meta las renombra, parte del verde volverá sin que nada falle a la vista.
# Cómo volver a inspeccionarlas, en la cabecera de la plantilla. Ver §27.
[templates.zapzap]
input_path  = "~/.config/matugen/templates/zapzap-waweb.css"
output_path = "~/.local/share/ZapZap/customizations/global/css/arch-msi.css"

# Aplicaciones GTK3 y GTK4 (tarea 3.5). UNA plantilla y DOS salidas: las dos
# versiones leen el mismo formato y aquí todas las claves valen para ambas.
#
# ⚠️ ESTAS DOS RUTAS ERAN ENLACES DE STOW hasta el 2026-09-16. El paquete
# `dotfiles/gtk/` se retiró en esta misma tarea y los enlaces se deshicieron con
# `stow -D` ANTES de declarar esto: de lo contrario theme-apply.sh habría
# abortado con "es un ENLACE de Stow", que es exactamente la protección que la
# regla de oro pone aquí. Si algún día `git status` muestra un settings.ini
# modificado dentro del repo, es que alguien volvió a enlazarlos.
[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk-settings.ini"
output_path = "~/.config/gtk-3.0/settings.ini"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk-settings.ini"
output_path = "~/.config/gtk-4.0/settings.ini"

# Colores de las aplicaciones GTK (tarea 3.5, paso B). Otra vez UNA plantilla y
# DOS salidas: los nombres de libadwaita valen igual para GTK4 y para adw-gtk3.
#
# ⚠️ `gtk.css` NO EXISTÍA en ninguna de las dos rutas antes de esto, así que no
# pisa nada del usuario. Si algún día se quisiera CSS propio a mano, tendría que
# entrar por esta plantilla: un archivo suelto ahí lo borraría theme-apply.
[templates.gtk3-colors]
input_path  = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4-colors]
input_path  = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/gtk.css"

# Esquema de color de KDE (tarea 3.5, paso C). Dolphin es KF6 y sus colores los
# pone KColorScheme, que lee ~/.config/kdeglobals y NO la paleta de Qt: por eso
# el paso C no se resuelve con un platformtheme. Ver §33.
#
# ⚠️ La salida es un INTERMEDIO. `theme-apply` funde sus secciones de color en
# ~/.config/kdeglobals, que no se puede generar entero porque ahí escribe
# también Dolphin. El nombre de este artefacto no existe en el repo, así que la
# regla de oro se cumple.
[templates.kde-colors]
input_path  = "~/.config/matugen/templates/kde-colors.conf"
output_path = "~/.config/kdeglobals-arch-msi.conf"

# Tema de Kvantum (tarea 3.5). Kvantum es un QStyle: pinta los widgets de las
# aplicaciones Qt él mismo, que es la única forma de que Dolphin lleve los
# colores del tema sin cambiar el `platformtheme` —cambiarlo rompía la señal de
# modo oscuro que necesita ZapZap, ver §33—.
#
# ⚠️ Un tema de Kvantum son DOS archivos: este INI y un SVG con las formas de
# cada widget. El SVG no es una plantilla ni se versiona: lo copia theme-apply
# de un tema del sistema. Ver la sección 5d del script.
[templates.kvantum]
input_path  = "~/.config/matugen/templates/kvantum-theme.kvconfig"
output_path = "~/.config/Kvantum/arch-msi/arch-msi.kvconfig"

# Las FORMAS de los widgets. Desde el 2026-09-16 también se generan: el SVG es
# el de HyDE (GPL-3.0) con sus marcadores de color sustituidos por variables de
# matugen. Antes se copiaba uno del sistema, pero los del sistema llevan sus
# colores cableados y por eso la cabecera y las filas de Dolphin no había forma
# de teñirlas. Ver §33.
[templates.kvantum-svg]
input_path  = "~/.config/matugen/templates/kvantum-theme.svg"
output_path = "~/.config/Kvantum/arch-msi/arch-msi.svg"

[templates.kvantum-select]
input_path  = "~/.config/matugen/templates/kvantum-select.kvconfig"
output_path = "~/.config/Kvantum/kvantum.kvconfig"

