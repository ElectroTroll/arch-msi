# hyprlock.conf — configuración mínima de validación inicial
# Origen: recortado de /usr/share/hypr/hyprlock.conf (sample de hyprlock 0.9.6-1)
# Fecha: 2026-07-25 — Tarea 2.3, paso 1/4 (arch-msi)
# Sin autostart, sin auth/fingerprint. Animaciones desactivadas explícitamente:
# omitir el bloque NO las desactiva (hyprlock aplica sus defaults, con
# fadeIn/fadeOut activos), así que se fija enabled = false a propósito.

general {
    hide_cursor = false
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgba(25, 20, 20, 1.0)
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)

    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    font_family = Monospace
    fade_on_empty = false
    rounding = 15

    placeholder_text = Input password...
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}
