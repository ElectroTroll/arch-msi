# hyprlock.conf — MSI Summit E16 AI Studio (arch-msi)
# Origen: recortado del sample /usr/share/hypr/hyprlock.conf.
# Fecha: 2026-07-25 (tarea 2.3, completada) · revisada el 2026-08-27 con
# hyprlock 0.9.6-2: sigue siendo deliberadamente MÍNIMA —fondo liso y campo de
# contraseña— y no por estar a medias. Ampliarla es opcional, no una tarea
# pendiente.
# Sin autostart, sin auth/fingerprint. Animaciones desactivadas explícitamente:
# omitir el bloque NO las desactiva (hyprlock aplica sus defaults, con
# fadeIn/fadeOut activos), así que se fija enabled = false a propósito.
#
# COLORES Y TIPOGRAFÍA: NO se definen aquí desde el 2026-08-27 (tarea 3.0). Los
# genera matugen a partir del fondo de pantalla en `theme.conf`, que es un
# ARTEFACTO —archivo real junto a estos enlaces, fuera del repo y fuera de
# Stow—. Este archivo conserva la ESTRUCTURA (qué bloques hay, tamaños,
# posiciones) y usa las variables de aquel.
#
# ⚠️ LA RUTA NO PUEDE SER RELATIVA. Este archivo es un ENLACE de Stow, así que
# hyprlang resuelve `source = theme.conf` contra el archivo REAL —dentro del
# repositorio—, donde no hay ningún theme.conf, y falla con
#     source= globbing error: found no match
# dejando todas las variables sin definir. Verificado el 2026-08-27.
# (En Waybar el @import relativo SÍ funciona, pero porque allí el style.css es
# un artefacto real en ~/.config, no un enlace.)
# La plantilla versionada está en
# dotfiles/matugen/.config/matugen/templates/hyprlock-theme.conf.
source = ~/.config/hypr/theme.conf

general {
    hide_cursor = false
}

animations {
    enabled = false
}

background {
    monitor =

    # EL FONDO DE PANTALLA EN USO, desenfocado y oscurecido. La ruta la inyecta
    # theme-apply.sh preguntándosela a hyprpaper, así que el bloqueo enseña la
    # misma imagen que el escritorio aunque cambie en cada arranque.
    #
    # ⚠️ Si el tema se generó con `--seed` no hay imagen: $wallpaper queda vacío
    # y hyprlock cae al $color de abajo. Por eso el color sigue declarado.
    path = $wallpaper

    # Ajustes en theme/tokens.toml → [lock]. NO es un porcentaje: el desenfoque
    # es `blur_passes` pasadas de radio `blur_size`.
    blur_passes = $blur_passes
    blur_size = $blur_size
    brightness = $brightness
    contrast = $contrast
    vibrancy = $vibrancy

    # Respaldo si no hay imagen. Antes era rgba(25,20,20,1.0): un negro CÁLIDO
    # que no pintaba nada en un escritorio de grises azulados.
    color = $bg
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = $border
    inner_color = rgba(0, 0, 0, 0.0)

    # Los tres estados del campo. Eran los gradientes cian/verde/naranja de la
    # plantilla de fábrica, la única parte del escritorio que seguía fuera de
    # la paleta del proyecto.
    outer_color = $accent
    check_color = $ok
    fail_color = $crit

    font_color = $fg
    # Era `Monospace` genérico: resolvía a lo que decidiera fontconfig, y era el
    # único componente que no usaba la fuente del proyecto.
    font_family = $font
    fade_on_empty = false
    rounding = $radius

    # Textos en theme/strings.toml, no aquí: se cambian sin tocar la estructura
    # ni regenerar nada más que el tema.
    placeholder_text = $txt_placeholder
    fail_text = $txt_fail
    check_text = $txt_verifying

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# --- Reloj -------------------------------------------------------------------
# Arriba y centrado, sobre el fondo desenfocado. `$TIME` lo resuelve hyprlock y
# se actualiza solo: no hace falta un `cmd[update:1000]` con `date`, que además
# lanzaría un proceso por segundo durante todo el bloqueo.
#
# Va en blanco puro y no en el $fg del tema, a propósito: se dibuja sobre una
# FOTO, no sobre una superficie del tema (ver [lock].clock_color en tokens.toml).
label {
    monitor =
    text = $TIME
    color = $clock_color
    font_size = $clock_size
    # Fuente propia, más gruesa que la del resto (ver [lock].clock_font).
    font_family = $clock_font

    # valign = top ancla al borde superior; `position` desplaza desde ahí, y la
    # Y NEGATIVA baja. halign = center lo centra horizontalmente.
    position = 0, -$clock_offset
    halign = center
    valign = top
}
