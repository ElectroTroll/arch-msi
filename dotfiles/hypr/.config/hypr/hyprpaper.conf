# hyprpaper.conf — MSI Summit E16 AI Studio (arch-msi)
# Fecha: 2026-08-25 · Tarea 2.4.
# Verificado con hyprpaper 0.8.4-6 sobre Hyprland 0.56.2.
#
# ⚠️ ESTA VERSIÓN NO USA LA SINTAXIS DE LA WIKI. NO COPIAR EJEMPLOS DE INTERNET.
#
# hyprpaper 0.8.x se reescribió sobre hyprtoolkit y cambió el esquema de
# configuración. El de la wiki y el de casi todos los tutoriales es el clásico:
#
#     preload   = /ruta/imagen.png          <- IGNORADO en 0.8.4
#     wallpaper = eDP-1,/ruta/imagen.png    <- IGNORADO en 0.8.4
#
# VERIFICADO el 2026-08-25: con esa config el resultado es idéntico al de un
# archivo VACÍO, y el journal solo dice
#     Monitor eDP-1 has no target: no wp will be created
# SIN ningún error. Es un fallo silencioso perfecto: proceso vivo, servicio
# activo, cero mensajes, cero fondo.
#
# La causa es una asimetría de hyprlang, también verificada: una clave
# desconocida DENTRO de una categoría conocida sí da error
#     Config error ...: config option <wallpaper:image> does not exist.
# pero una clave desconocida en el NIVEL SUPERIOR se acepta sin decir nada.
# `preload` y `wallpaper = ...` caen en el segundo caso.
#
# El esquema real se dedujo de las cadenas del binario y se confirmó probando
# cada clave contra `hyprpaper -c` con una config de usar y tirar.

wallpaper {
    # VACÍO A PROPÓSITO = todas las salidas.
    #
    # NO poner `eDP-1` aquí. Es una de las dos rutas frágiles que esta tarea
    # tenía que evitar: un nombre de salida codificado se rompe al conectar un
    # monitor externo (que se quedaría sin fondo) y podría cambiar tras una
    # reinstalación. Verificado que la forma vacía funciona; verificado también
    # que `monitor = eDP-1` funciona, pero se descarta por frágil.
    monitor =

    # DIRECTORIO, no un archivo: hyprpaper elige una imagen de dentro.
    #
    # `~/Wallpapers` es UN ÚNICO ENLACE SIMBÓLICO al directorio del repo
    # (dotfiles/wallpapers/Wallpapers/), creado por Stow. Eso importa y no es
    # un detalle de implementación: cualquier imagen que se deje caer en
    # ~/Wallpapers aterriza DIRECTAMENTE en el repositorio y aparece en
    # `git status`, sin copiar nada a mano.
    #
    # Si ~/Wallpapers existiera como directorio real, Stow enlazaría archivo
    # por archivo y las imágenes nuevas quedarían FUERA del repo. Por eso el
    # directorio vacío se eliminó antes de enlazar. Al restaurar en una
    # máquina nueva: NO crear ~/Wallpapers a mano; dejar que lo cree
    # `stow -d dotfiles -t ~ wallpapers`.
    #
    # RUTA RELATIVA AL HOME, NO ABSOLUTA. La otra ruta frágil: `/home/elok/...`
    # se rompería con otro nombre de usuario tras reinstalar. VERIFICADO que
    # hyprpaper 0.8.4 expande tanto `~` como `$HOME`, y que una ruta
    # inexistente sí falla con `Failed to resolve path ...` (o sea, que la
    # prueba mide algo).
    path = ~/Wallpapers

    # cover | contain | tile.
    #
    # `cover` escala y RECORTA hasta llenar la pantalla, sin deformar. Es lo
    # que permite dejar caer imágenes de cualquier proporción en la carpeta:
    # hyprpaper se encarga del recorte, no hace falta preprocesarlas para que
    # se vean bien. (Sí conviene preprocesarlas por PESO, ver más abajo.)
    #
    # El panel es 2560x1600, es decir 16:10. Una imagen 16:9 perderá franjas
    # laterales; una 2:1 perderá un 20% del ancho. `contain` evitaría el
    # recorte a cambio de barras negras, y `tile` no tiene sentido aquí.
    fit_mode = cover

    # default | random | random-shuffle.
    #
    # MEDIDO el 2026-08-25 con inotify sobre el directorio, porque la
    # diferencia no está documentada en ninguna parte:
    #   - `random`         -> punto de partida ALEATORIO y luego ciclo
    #                         secuencial:  img3 img4 img5 img1 img2 img3...
    #   - `random-shuffle` -> barajado real, admite repeticiones seguidas:
    #                         img3 img5 img1 img4 img2 img1 img3...
    # Con `timeout = 0` solo se usa la PRIMERA elección, así que los dos
    # servirían; se deja `random` por ser el de comportamiento más simple.
    order = random

    # false = solo el primer nivel del directorio. Ponlo en `true` si algún día
    # organizas los fondos en subcarpetas.
    recursive = false

    # 0 = NO rotar mientras la sesión está viva.
    #
    # Es lo pedido: el fondo cambia EN CADA ARRANQUE, como los fondos por
    # defecto de Hyprland, no cada X segundos.
    #
    # VERIFICADO con 8 arranques consecutivos (`timeout = 0`, `order = random`,
    # 5 imágenes): cada arranque abre UNA sola imagen y varía entre ejecuciones.
    # La aleatoriedad es de calidad modesta —en esos 8 arranques salieron 3 de
    # las 5 imágenes— pero varía, que es lo que se pedía.
    #
    # Si algún día quieres rotación por tiempo, pon aquí los segundos: está
    # probado que funciona (con `timeout = 3` abría una imagen distinta cada
    # 3 s, comprobado con inotify).
    timeout = 0
}

# --- Splash -----------------------------------------------------------------
# Texto de versión superpuesto al fondo. Se deja desactivado por opacidad 0.
#
# ⚠️ TRAMPA: `splash_offset` es un ENTERO. Un `2.0` aquí aborta TODA la config
# con `cannot parse "2.0" as an int` y te quedas sin fondo. Verificado.
splash_offset  = 2
splash_opacity = 0

# --- Notas sobre el contenido de ~/Wallpapers -------------------------------
#
# ARCHIVOS NO-IMAGEN: son inofensivos. VERIFICADO que hyprpaper los abre para
# husmear el tipo con libmagic pero NO los selecciona; con basura junto a
# imágenes válidas funciona sin un solo aviso. Solo falla si NO hay ninguna
# imagen válida, y entonces sí lo dice claro:
#     Provided path(s) '...' does not contain a valid image
#
# PESO: la carpeta está versionada en un repo PÚBLICO y git guarda cada versión
# de cada binario entera y para siempre. Conviene meter las imágenes ya
# ajustadas a 2560x1600 en vez de originales de 6000x3000: son ~530 KB frente a
# ~3 MB, y hyprpaper no nota la diferencia porque de todos modos recorta.
#     magick original.jpg -resize x1600 -gravity center -extent 2560x1600 \
#            -quality 92 ~/Wallpapers/nombre.jpg
