# hypridle.conf — MSI Summit E16 AI Studio (arch-msi)
# Origen: /usr/share/hypr/hypridle.conf (hypridle 0.1.7-10), reducido.
# Fecha: 2026-07-26 · Tarea 2.3, pasos 2/4, 3a/4, 3b/4 y 3c/4.
# Revalidado con hypridle 0.1.8-1 el 2026-08-01: sin cambios necesarios.
#
# ALCANCE: bloque `general` + 3 listeners (brillo, bloqueo, y apagado de
# pantalla + suspensión sólo con batería).
#
# 2026-08-25: se añade el apagado de pantalla a los 900 s, que faltaba desde
# el principio (ver aviso de DPMS abajo). NO se usa el dispatcher de Hyprland
# sino `wlopm`, cliente del protocolo zwlr_output_power_manager_v1.
#
# NOTA sobre brillo: intel_backlight tiene max_brightness=192000 -> usar
# porcentaje (`set 10%`), nunca el `set 10` crudo del sample. Este equipo NO
# tiene kbd_backlight, así que el listener de teclado del sample no aplica.

general {
    # Se ejecuta al recibir el evento dbus de bloqueo (loginctl lock-session).
    # `pidof hyprlock ||` evita apilar instancias si llegan varios eventos.
    # OJO: la subcadena "hyprlock" de esta línea es lo que activa el modo
    # fuerte de inhibit_sleep=2 (ver abajo). No renombrar a un wrapper.
    lock_cmd = pidof hyprlock || hyprlock

    # OBJETIVO DEL PASO: bloquear ANTES de dormir. Cierra el agujero
    # "cerrar tapa -> suspender -> abrir -> escritorio sin contraseña".
    before_sleep_cmd = loginctl lock-session

    # Reenciende la pantalla al volver de suspender. Es la SEGUNDA red: la
    # primera es el `on-resume` del listener 3. Ambas son idempotentes, así
    # que ejecutar las dos no molesta. Sobra una de las dos en el caso normal,
    # pero el fallo que cubren (despertar a una pantalla negra que parece un
    # equipo colgado) es exactamente el susto del 2026-07-27; barato pagarlo.
    after_sleep_cmd = wlopm --on '*'

    # AVISO — NO USAR DISPATCHERS DPMS DE HYPRLAND EN ESTE EQUIPO:
    #   - `hyprctl dispatch dpms on` (sintaxis hyprlang del sample) NO es
    #     válida en Hyprland 0.56 con configuración Lua. Falla con:
    #     error: [string "return hl.dispatch(dpms on)"]:1: ')' expected near 'on'
    #   - El equivalente Lua `hyprctl dispatch 'hl.dsp.dpms("on")'` APAGÓ la
    #     pantalla en vez de encenderla (2026-07-27). Irrecuperable: no
    #     respondió a teclado, ratón, tapa ni cambio de VT. Sólo se recuperó
    #     con `systemctl reboot`.
    # No hay sintaxis DPMS verificada para 0.56 + Lua. No probar a ciegas.
    #
    # POR QUÉ `wlopm` SÍ (2026-08-25): no pasa por ninguna de esas dos vías.
    # Es un cliente del protocolo estándar zwlr_output_power_manager_v1: habla
    # con el compositor directamente, sin `hyprctl`, sin el IPC de Hyprland y
    # sobre todo SIN el parser Lua, que es donde reventó. Que Hyprland 0.56
    # anuncia ese protocolo está VERIFICADO en el journal del propio hypridle:
    #   [LOG]   | got iface: zwlr_output_power_manager_v1 v1
    # Además `--on` y `--off` son rutas de código distintas, así que no puede
    # repetirse el fallo de entonces (un argumento mal interpretado que acabó
    # apagando cuando se pedía encender).

    # 0=disable 1=normal 2=auto 3=lock-notify.
    # El modo 2 busca la subcadena "hyprlock" en before_sleep_cmd y lock_cmd;
    # al encontrarla en lock_cmd, retiene el inhibidor de suspensión de logind
    # hasta que la sesión wayland está REALMENTE bloqueada -> sin carrera.
    #
    # SOBRE EL DEFAULT: en 0.1.7-10 se verificó que era 2 (`mov esi,0x2` en el
    # addConfigValue). En 0.1.8 ese método ya NO sirve: cambió la generación de
    # código y el patrón no aparece. Da igual, y por eso se fija el valor
    # explícitamente: la config no depende del default de ninguna versión.
    #
    # VERIFICADO EN 0.1.8-1 (2026-08-01) por observación, no por el binario:
    # el journal registra al arrancar
    #   "Sleep inhibition enabled - inhibiting until the wayland session gets
    #    locked"  ->  "Inhibited sleep with fd 10"
    # y al bloquearse  ->  "Releasing the sleep inhibitor!".
    # Es la semántica del modo 2, descrita en palabras por el propio binario.
    #
    # NO subir a 3: rompe on_lock_cmd / on_unlock_cmd. El aviso sigue presente
    # como cadena literal en el binario 0.1.8.
    #
    # AHORA ESE AVISO NOS AFECTA DE VERDAD: hasta la tarea 2.2 no se usaba
    # ninguna de las dos directivas, así que subir a 3 solo habría roto algo
    # hipotético. Desde 2026-08-04 las dos líneas de abajo dependen del modo 2.
    # Con inhibit_sleep = 3, dunst se quedaría pausado o sin pausar en silencio.
    inhibit_sleep = 2

    # --- Notificaciones con la sesión bloqueada (tarea 2.2) -----------------
    # PROBLEMA: dunst dibuja en la capa `overlay` de wlr-layer-shell y hyprlock
    # usa el protocolo ext-session-lock. NO se ha comprobado si Hyprland 0.56
    # pinta la superficie de bloqueo por encima de esa capa; si no lo hiciera,
    # el remitente y el asunto de cada notificación se leerían con el equipo
    # bloqueado. Esto lo cierra sin depender de esa respuesta.
    #
    # `set-paused true` ENCOLA, no descarta: las notificaciones que lleguen
    # durante el bloqueo se acumulan (`dunstctl count` las muestra en
    # "Waiting") y salen todas al desbloquear. No se pierde ninguna.
    #
    # Existen en hypridle 0.1.8 (verificado: cadenas `general:on_lock_cmd` y
    # `general:on_unlock_cmd` presentes en el binario) y se disparan con los
    # eventos dbus de la sesión, igual que lock_cmd.
    #
    # ⚠️ TRAMPA: el estado de pausa vive en el proceso de dunst, NO en hypridle.
    # Si hypridle muriera o se reiniciara con la sesión ya bloqueada, el
    # `on_unlock_cmd` nunca llegaría y dunst se quedaría PAUSADO PARA SIEMPRE,
    # sin avisar de nada: no salta ninguna notificación y no hay error en
    # ningún journal. Se diagnostica con `dunstctl is-paused` (→ `true`) y se
    # arregla con `dunstctl set-paused false`.
    # Falla hacia el lado seguro en el otro sentido: la pausa no sobrevive a
    # un reinicio de dunst ni al cierre de sesión, así que un arranque limpio
    # siempre parte de "no pausado".
    on_lock_cmd = dunstctl set-paused true
    on_unlock_cmd = dunstctl set-paused false
}

# --- Listener 1 de 3: atenuar el brillo -------------------------------------
# 480 s = 8 min, DOS MINUTOS ANTES del bloqueo (600 s). El atenuado funciona
# como aviso visual: al oscurecerse la pantalla queda margen para mover el
# ratón antes de que salte hyprlock.
# Se coloca antes del listener de bloqueo por orden cronológico (480 < 600),
# por legibilidad. No está verificado si hypridle depende del orden del
# archivo o sólo del valor de `timeout`; mantener el orden cronológico evita
# tener que averiguarlo.
listener {
    # 480 s = 8 min.
    timeout = 480

    # `-s` guarda el brillo actual ANTES de atenuar; `-r` (on-resume) lo
    # restaura. El estado vive en /run/user/1000/brightnessctl/ (tmpfs), así
    # que no sobrevive a un reinicio, que es lo deseable.
    #
    # `10%` CON el signo de porcentaje, NUNCA `10` a secas: brightnessctl
    # interpreta el valor desnudo en unidades del device, y con
    # max_brightness=192000 un `set 10` daría 10/192000 = 0,005% -> pantalla
    # negra. El sample de upstream escribe `set 10` porque asume un max muy
    # inferior. 10% aquí son 19200 unidades.
    on-timeout = brightnessctl -s set 10%

    # Restaura el brillo guardado en cuanto se detecta actividad.
    on-resume = brightnessctl -r

    # TRAMPA del par -s/-r: el estado guardado es UN SOLO valor y cada `-s`
    # lo sobrescribe. Si hypridle muere o se reinicia con la pantalla ya
    # atenuada, el `on-resume` nunca llega; en el siguiente periodo de
    # inactividad `-s` guardará el 10% como si fuera el brillo normal, y a
    # partir de ahí `-r` restaurará al 10% para siempre.
    # Es fácil de sufrir mientras hypridle se lance a mano en primer plano
    # (hasta el paso 4 no hay servicio) y ENGAÑOSO: no imprime ningún error,
    # sólo deja una pantalla oscura que parece un fallo de hardware.
    # SOLUCIÓN: subir el brillo a mano con las teclas XF86MonBrightness (o
    # `brightnessctl set 100%`) y esperar al siguiente `-s`, que reguardará
    # el valor correcto.
}

# --- Listener 2 de 3: bloqueo por inactividad -------------------------------
# Este bloque hace desaparecer el error de arranque
#   [ERR] Config has errors: No rules configured
# que era ESPERADO mientras el archivo tenía cero reglas: hypridle exige al
# menos un listener (cadenas "No rules configured" y "Config has errors:"
# presentes en el binario, comprobado en 0.1.7-10 y de nuevo en 0.1.8-1).
# No era un fallo de sintaxis.
listener {
    # 600 s = 10 min de inactividad. El sample de upstream usa 300 s; aquí se
    # sube al doble a petición del usuario (2026-08-02), para que la sesión no
    # se bloquee en pausas cortas.
    timeout = 600

    # Vía dbus, NO `hyprlock` directo: así hypridle recibe el evento y lanza
    # su `lock_cmd` (ver bloque `general`), el mismo camino que ya validamos
    # con `before_sleep_cmd`. Invocar hyprlock a pelo saltaría ese camino y
    # dejaría a hypridle sin constancia de que la sesión está bloqueada.
    on-timeout = loginctl lock-session

    # Sin `on-resume`: no hay nada que restaurar al volver. hyprlock se cierra
    # solo cuando el desbloqueo con contraseña tiene éxito.
}

# --- Listener 3 de 3: suspender, SÓLO con batería ---------------------------
# 900 s = 15 min, CINCO MINUTOS después del bloqueo (600 s): cuando esto se
# dispara la sesión ya está bloqueada, así que al despertar hyprlock ya está
# en pantalla y `before_sleep_cmd` no tiene nada nuevo que hacer.
# El margen se ha estrechado de 10 a 5 minutos al subir el bloqueo de 300 a
# 600 s. Sigue habiendo holgura de sobra; si algún día el bloqueo pasara de
# 900 s, este listener se dispararía ANTES que el bloqueo y `before_sleep_cmd`
# sí tendría trabajo. No es el caso hoy.
#
# hypridle RESPETA los inhibidores de inactividad: un vídeo a pantalla
# completa no llega a disparar esto. Pero un proceso largo en terminal
# (compilación, descarga, backup) NO inhibe nada y sí lo dispararía; de ahí
# la guarda de batería, que evita cortar ese tipo de trabajo estando
# enchufado.
#
# SIN HIBERNACIÓN en este equipo: sólo zram, sin swap en disco, así que esto
# es suspensión a RAM. Si la batería se agota durante la suspensión se pierde
# todo lo no guardado.
listener {
    # 900 s = 15 min.
    timeout = 900

    # SÓLO SUSPENDE CON BATERÍA. `ADP1/online` vale 0 con batería y 1
    # enchufado; si está enchufado el `grep` falla, el `&&` cortocircuita y
    # no pasa nada.
    #
    # `-x` exige coincidencia de LÍNEA COMPLETA: sólo dispara si el archivo
    # contiene exactamente `0`. `-q` silencia la salida.
    #
    # A propósito NO se usa `[ "$(cat ...)" = 0 ]`: hyprlang usa `$` para sus
    # propias variables y no está verificado que un `$(...)` llegue intacto
    # al shell. `grep` esquiva el problema: sin comillas ni sustitución de
    # comandos. El `&&` sí es válido porque hypridle pasa el comando a un
    # shell (verificado con el `pidof hyprlock ||` del bloque `general`).
    #
    # La guarda se evalúa EN EL INSTANTE en que vence el timeout. Si en ese
    # momento estabas enchufado, NO habrá reintento: hypridle no vuelve a
    # disparar este listener hasta que haya actividad y se acumule un nuevo
    # periodo de inactividad completo.
    #
    # VERIFICADO (2026-07-27): `ADP1/online` SÍ refleja la carga por USB-C
    # PD. Probado con los DOS puertos USB-C por separado: ambos dan
    # ADP1/online=1 y BAT1/status=Charging. Confirmado además desde sysfs por
    # ucsi-source-psy-USBC000:001 con usb_type = C [PD] PD_PPS.
    # Este equipo NO tiene conector de corriente propio: toda la alimentación
    # externa entra por USB-C, así que la guarda cubre todos los escenarios
    # posibles de alimentación.
    # DOS acciones encadenadas con `;`, en ESTE orden:
    #   1. apagar la pantalla SIEMPRE, enchufado o no;
    #   2. suspender SÓLO con batería (la guarda de ADP1 no cambia).
    # Enchufado, la 2 no hace nada y la secuencia termina con la pantalla
    # apagada, que es justo lo pedido: sin suspender pero sin panel encendido.
    #
    # EL `;` Y SU ORDEN ESTÁN VERIFICADOS (2026-08-25), no supuestos: se midió
    # con una instancia desechable de hypridle (`hypridle -c`) apuntando a una
    # config de usar y tirar cuyo listener sólo registraba sus argumentos. Los
    # comandos se ejecutaron los tres y en el orden escrito.
    #
    # LAS COMILLAS DE '*' SON OBLIGATORIAS. La misma medición demostró que:
    #   - hyprlang NO se come las comillas: el shell recibe un `*` literal;
    #   - sin comillas el shell SÍ hace globbing contra el CWD de hypridle,
    #     y `wlopm --off` acabaría recibiendo nombres de fichero.
    # El comodín `*` (todas las salidas) está documentado en wlopm(1), sección
    # OUTPUT NAMES. Se usa en vez de `eDP-1` para que un monitor externo
    # también se apague, sin depender de un nombre de dispositivo concreto
    # (misma clase de fragilidad que `ADP1`, ver arriba).
    on-timeout = wlopm --off '*' ; grep -qx 0 /sys/class/power_supply/ADP1/online && systemctl suspend

    # Reenciende la pantalla en cuanto hay actividad. El brillo lo restaura
    # aparte el `on-resume` del listener 1; son independientes y compatibles.
    #
    # ⚠️ TRAMPA, de la misma familia que la del par -s/-r del listener 1: el
    # apagado vive en el COMPOSITOR, no en hypridle. Si hypridle muriera o se
    # reiniciara con la pantalla ya apagada, este `on-resume` no llegaría
    # nunca y la pantalla se quedaría negra sin error en ningún log, con el
    # equipo por lo demás vivo. Se arregla con `wlopm --on '*'` a ciegas, o
    # reiniciando hypridle. [NO VERIFICADO] si un cambio de VT la recupera.
    on-resume = wlopm --on '*'
}
