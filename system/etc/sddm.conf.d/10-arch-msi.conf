# 10-arch-msi.conf — drop-in de SDDM (arch-msi)
#
# Fuente:  system/etc/sddm.conf.d/10-arch-msi.conf   (esto, versionado)
# Destino: /etc/sddm.conf.d/10-arch-msi.conf         (lo instala greeter-apply)
#
# SDDM lee /etc/sddm.conf y luego los *.conf de /etc/sddm.conf.d en orden
# alfabético, aplicando lo de después encima (man sddm.conf, FILES). Se usa un
# drop-in y NO /etc/sddm.conf para no pelearse nunca con el archivo que pueda
# dejar el paquete: aquí solo está lo que este equipo cambia.
#
# Hasta el 2026-09-08 no existía NINGUNA configuración de SDDM en el sistema
# —ni /etc/sddm.conf ni /etc/sddm.conf.d— y el greeter era el de fábrica.

[Theme]
Current=arch-msi

[General]
# El greeter arranca en X11 (hay un Xorg en vt2 bajo sddm, ver §9). No se toca:
# cambiarlo a Wayland es una decisión aparte y con su propia validación.
