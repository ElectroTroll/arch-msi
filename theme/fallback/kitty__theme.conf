# theme.conf — PLANTILLA del tema de kitty (arch-msi)
#
# Fuente:  dotfiles/matugen/.config/matugen/templates/kitty-theme.conf (esto)
# Salida:  ~/.config/kitty/theme.conf                                  (artefacto)
#
# ⚠️ NO EDITAR la salida: la reescribe matugen en cada arranque.
#
# kitty.conf sigue enlazado por Stow y hace `include theme.conf`. Mismo patrón
# que dunst y hyprlock: la config de comportamiento se versiona, el tema se
# genera al lado.

# --- Tipografía --------------------------------------------------------------
# kitty mide en PUNTOS, como dunst, no en píxeles como Waybar.
font_family      JetBrainsMono Nerd Font
font_size        11

# --- Fondo y transparencia ---------------------------------------------------
# La misma opacidad que la barra y las notificaciones: [opacity].surface.
#
# ⚠️ La transparencia real depende del compositor; Hyprland la soporta. Y OJO:
# con background_opacity < 1, kitty deshabilita por su cuenta algunas
# optimizaciones de dibujado, así que si algún día el terminal va lento con
# mucha salida, esto es lo primero que hay que probar a subir a 1.0.
background_opacity 0.8

background       #0c141b
foreground       #edf6ff

# El cursor y la selección SÍ siguen al fondo de pantalla: son elementos de la
# interfaz del terminal, no información con significado propio.
cursor           #58b4ef
cursor_text_color #0c141b

selection_background #58b4ef
selection_foreground #0c141b

url_color        #58b4ef

# Bordes de las ventanas divididas de kitty.
active_border_color   #58b4ef
inactive_border_color #6d757e

# --- Los 16 colores ANSI -----------------------------------------------------
# FIJOS, de theme/tokens.toml → [colors.term] y [colors.state]. No salen de
# matugen: su paleta base16 devuelve ocho azules casi negros indistinguibles
# entre sí, y aquí el color ES información (ls, git diff, avisos del shell).
#
# El rojo, el verde y el amarillo se reutilizan de [colors.state] para no tener
# el mismo valor escrito dos veces en el repositorio.
color0  #15161e
color8  #414868

color1  #f7768e
color9  #f7768e

color2  #9ece6a
color10 #9ece6a

color3  #e0af68
color11 #e0af68

color4  #7aa2f7
color12 #8db0ff

color5  #bb9af7
color13 #c7a9ff

color6  #7dcfff
color14 #a4daff

color7  #a9b1d6
color15 #c0caf5
