# Lo seleccionado: el acento del escritorio, el mismo que el borde de la ventana
# activa y que la selección en GTK.
# ⚠️ AQUÍ SE DECIDE LA SELECCIÓN DE DOLPHIN, no en Kvantum. El resalte del ratón
# (hover) lo pinta Kvantum desde su SVG y por eso ya salía translúcido, pero la
# fila SELECCIONADA la pinta Dolphin leyendo esta sección, que hasta el
# 2026-09-16 solo admitía colores opacos: por eso quedaba como un bloque azul
# macizo por mucho alfa que se le pusiera al tema de Kvantum.
#
# El color es el tono de selección de tokens.toml —más saturado que el acento—
# con su alfa. La fusión de theme-apply lo convierte a `R,G,B,A`, que es como
# KDE escribe un color con transparencia.
[Colors:Selection]
BackgroundNormal=#D9007eb6
BackgroundAlternate=#D9007eb6
ForegroundNormal=#002337
ForegroundInactive=#002337
ForegroundActive=#002337
ForegroundLink=#002337
ForegroundVisited=#002337
ForegroundNegative=#f7768e
ForegroundNeutral=#e0af68
ForegroundPositive=#9ece6a
DecorationFocus=#58b4ef
DecorationHover=#58b4ef

