# kdeglobals-arch-msi.conf — PLANTILLA del esquema de color KDE (arch-msi)
#
# Fuente: dotfiles/matugen/.config/matugen/templates/kde-colors.conf  (esto)
# Salida: ~/.config/kdeglobals-arch-msi.conf                          (artefacto)
#
# ⚠️ ESTE ARCHIVO NO LO LEE NADIE DIRECTAMENTE. Es un paso intermedio:
# `theme-apply` lo FUNDE en ~/.config/kdeglobals, que es de donde lee
# KColorScheme. Mismo patrón que el tema del greeter (§24), que también pasa por
# un artefacto intermedio antes de llegar a su destino.
#
# POR QUÉ NO SE ESCRIBE DIRECTAMENTE SOBRE kdeglobals. Ese archivo NO es nuestro:
# lo escribe también Dolphin (la sección [KFileDialog Settings] con el tamaño de
# la barra lateral, el orden de columnas...). Generarlo entero borraría esos
# ajustes en cada arranque, y Dolphin los volvería a escribir, y así
# indefinidamente. Por eso se funden solo las secciones de color.
#
# ⚠️ AQUÍ LOS COLORES VAN EN HEX porque se leen mejor al revisar el artefacto;
# la fusión los convierte a "R,G,B" decimal, que es el formato que escribe KDE.
#
# QUIÉN USA ESTO. Dolphin (KF6) enlaza libKF6ColorScheme, y KColorScheme lee
# estas secciones. Sin ellas usa los valores compilados de Breeze, que es de
# donde venían los azules que no pintaba nadie del tema.
#
# Los doce nombres de clave salen del propio binario
# (`strings /usr/lib/libKF6ColorScheme.so`), no de una lista de internet.

# ⚠️ EL FONDO ALTERNO ES EL MISMO QUE EL NORMAL EN TODOS LOS CONJUNTOS. Dolphin
# pinta las filas alternas leyendo [Colors:Window], no [Colors:View] como uno
# esperaría —sondeado el 2026-09-16: la sonda roja en View no salió, la de
# Window sí—. Si alguno vuelve a diferir, vuelven las bandas.
[General]
ColorScheme=arch-msi

# ⚠️ ESTO ES LO QUE CIERRA EL PENDIENTE DE LA 3.4. Al migrar Dolphin quedó
# abierto el «Abrir terminal aquí»: no aparece en ningún `.kcfg` suyo y no se
# localizó dónde se configuraba. No es de Dolphin, es de KDE entero, y vive
# aquí. Sale del repositorio de HyDE, que lo trae en su kdeglobals.
TerminalApplication=kitty
TerminalService=kitty.desktop

# Los MISMOS iconos que GTK y rofi. Sin esta sección, Dolphin —que es una rejilla
# de iconos— se queda con el tema de KDE y rompe la coherencia justo donde más
# se ve. Sale de [apps].icon_theme en tokens.toml.
[Icons]
Theme=Tela-circle-arch-msi

# Fondo general de las ventanas.
[Colors:Window]
BackgroundNormal=#0c141b
BackgroundAlternate=#0c141b
ForegroundNormal=#edf6ff
ForegroundInactive=#98a1a9
ForegroundActive=#58b4ef
ForegroundLink=#58b4ef
ForegroundVisited=#bac4fa
ForegroundNegative=#f7768e
ForegroundNeutral=#e0af68
ForegroundPositive=#9ece6a
DecorationFocus=#58b4ef
DecorationHover=#58b4ef

# Zonas de contenido: la lista de archivos de Dolphin es esto.
#
# ⚠️ AQUÍ ESTUVIERON EN #00000000 (transparentes) UNAS HORAS DEL 2026-09-16,
# copiando el truco de HyDE. Se revirtió al verlo funcionando: Dolphin pinta las
# filas ALTERNAS con su propio color, así que una vista transparente no queda
# translúcida sino A RAYAS, media dejando ver el wallpaper y media no.
#
# La transparencia de Dolphin la pone ahora la ventana entera (0.92 + blur, en
# tokens.toml), que es uniforme y se lee. Ver §33.
[Colors:View]
BackgroundNormal=#040b11
BackgroundAlternate=#040b11
ForegroundNormal=#edf6ff
ForegroundInactive=#98a1a9
ForegroundActive=#58b4ef
ForegroundLink=#58b4ef
ForegroundVisited=#bac4fa
ForegroundNegative=#f7768e
ForegroundNeutral=#e0af68
ForegroundPositive=#9ece6a
DecorationFocus=#58b4ef
DecorationHover=#58b4ef

[Colors:Button]
