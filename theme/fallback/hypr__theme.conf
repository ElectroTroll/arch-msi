# theme.conf — PLANTILLA del tema de hyprlock (arch-msi)
#
# Fuente:  dotfiles/matugen/.config/matugen/templates/hyprlock-theme.conf (esto)
# Salida:  ~/.config/hypr/theme.conf                                      (artefacto)
#
# ⚠️ NO EDITAR la salida: la reescribe matugen en cada arranque.
#
# hyprlock.conf sigue enlazado por Stow y solo hace `source = theme.conf` al
# principio; aquí solo viven VARIABLES. Es el mismo patrón que el drop-in de
# dunst, y funciona porque hyprlang sí tiene variables (`$nombre`), a diferencia
# de GTK CSS, que obligó a generar la hoja entera de Waybar.
#
# ⚠️ hyprlang escribe los colores SIN almohadilla —`rgb(58b4ef)`, no
# `rgb(#58b4ef)`—, de ahí los `_stripped` que prepara theme-apply.sh.

# --- Colores -----------------------------------------------------------------
$bg      = rgb(0c141b)
$bg_alt  = rgb(1d252c)
$fg      = rgb(edf6ff)
$muted   = rgb(6d757e)
$accent  = rgb(58b4ef)

# Estado: FIJOS, fuera de matugen. Que una contraseña fallida se vea igual con
# cualquier fondo de pantalla no es estética, es información.
$ok      = rgb(9ece6a)
$crit    = rgb(f7768e)

# --- Tipografía y métricas ---------------------------------------------------
$font    = JetBrainsMono Nerd Font
$radius  = 10
$border  = 2

# --- Fondo de la pantalla de bloqueo -----------------------------------------
# La RUTA de la imagen la inyecta theme-apply.sh: es el fondo que hyprpaper
# tenga puesto en ese momento, que cambia en cada arranque.
#
# ⚠️ Si el tema se generó desde una semilla (`--seed`) no hay imagen y esto
# queda VACÍO; hyprlock cae entonces al color liso de $bg.
$wallpaper    = /home/elok/Projects/arch-msi/dotfiles/wallpapers/Wallpapers/night-lake-mountains.jpg

$blur_passes  = 3
$blur_size    = 7
$brightness   = 0.75
$contrast     = 1
$vibrancy     = 0.2

$input_width  = 30%
$input_height = 5%
$clock_color  = rgb(ffffff)
$clock_size   = 160
$clock_font   = JetBrainsMono NF ExtraBold
$clock_offset = 120

# --- Textos (theme/strings.toml) ---------------------------------------------
# Se separan de los valores porque cambian por otros motivos. Las variables con
# $ de dentro ($ATTEMPTS, $FAIL…) las resuelve hyprlock al dibujar.
$txt_placeholder = Introduce la contraseña
$txt_fail        = Contraseña incorrecta · intento $ATTEMPTS
$txt_verifying   = Comprobando…
