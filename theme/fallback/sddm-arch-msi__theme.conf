# theme.conf — PLANTILLA del tema del greeter de SDDM (arch-msi)
#
# Fuente:  dotfiles/matugen/.config/matugen/templates/sddm-theme.conf  (esto)
# Salida:  ~/.config/sddm-arch-msi/theme.conf                          (artefacto)
#
# ⚠️ NO EDITAR la salida: la reescribe matugen en cada arranque.
#
# EL ARTEFACTO NO ES EL TEMA. Este archivo es solo el paso intermedio: el tema
# de verdad vive en /usr/share/sddm/themes/arch-msi/, que es de root porque el
# usuario `sddm` no puede leer /home/elok (drwx------). Quien lo copia allí es
# `greeter-apply` CON SUDO, a mano. Por eso el greeter NO sigue al fondo de
# pantalla como el resto del escritorio: se queda con el último aplicado hasta
# que se refresca. Ver PROJECT_CONTEXT §24.
#
# El QML lee estas claves como `config.<clave>` (Theme-API 2.0 de SDDM), así que
# Main.qml puede versionarse tal cual y no hace falta generarlo entero como la
# hoja de Waybar. Es el mismo reparto que hyprlock: estructura versionada,
# valores generados.
#
# ⚠️ Los nombres de clave son camelCase y NO se pueden cambiar sin tocar
# Main.qml: SDDM los expone con el nombre literal que tengan aquí.

[General]

# --- Fondo -------------------------------------------------------------------
# `background` es la imagen YA PROCESADA que deja greeter-apply junto al QML,
# con ruta relativa al directorio del tema. `wallpaperSrc`, en cambio, es el
# original y solo lo lee el instalador; el QML no lo usa (ni podría: está en un
# home que el greeter no puede leer).
background=background.jpg
wallpaperSrc=/home/elok/Projects/arch-msi/dotfiles/wallpapers/Wallpapers/night-lake-mountains.jpg

# Desenfoque y brillo los aplica ImageMagick al instalar, NO el QML. La primera
# versión desenfocaba con MultiEffect y la imagen solo cubría 1600x1000 de una
# ventana de 2560x1600 (ver la cabecera de Main.qml).
blurSigma=20
brightness=75

# --- Colores -----------------------------------------------------------------
colorBg=#0c141b
colorFg=#edf6ff
colorMuted=#6d757e
colorAccent=#58b4ef

# Estado: FIJOS, fuera de matugen, igual que en hyprlock y en dunst. Que una
# contraseña fallida se vea igual con cualquier fondo no es estética.
colorOk=#9ece6a
colorCrit=#f7768e

# Blanco puro y no colorFg: el reloj se dibuja sobre una FOTO, no sobre una
# superficie del tema (ver [lock].clock_color en tokens.toml).
colorClock=#ffffff

# --- Tipografía y métricas ---------------------------------------------------
fontFamily=JetBrainsMono Nerd Font

# ⚠️ EL RELOJ NO USA `lock_clock_font`. Ese token es "JetBrainsMono NF
# ExtraBold", que fontconfig resuelve a la familia + el estilo ExtraBold —y por
# eso hyprlock lo aplica bien—, pero Qt busca una FAMILIA con ese nombre
# literal, no la encuentra y cae a otra fuente sin decir nada. Aquí se manda la
# familia de verdad y el peso por separado, en la escala de Qt5 (ver
# [greeter].clock_weight en tokens.toml). El resultado es la misma tipografía
# que en la pantalla de bloqueo, que es de lo que se trataba.
fontClock=JetBrainsMono Nerd Font
fontClockWeight=81
radius=10
border=2

# Los mismos valores que hyprlock, para que las dos pantallas se vean iguales.
# El QML los interpreta como fracción de 1000 px de alto: ver la cabecera de
# Main.qml, donde se explica por qué no pueden ser píxeles fijos.
clockSize=160
clockOffset=120
inputWidth=30%
inputHeight=5%

# Propios del greeter: hyprlock no tiene equivalentes. Ver [greeter] en
# tokens.toml.
nameGap=28
passwordSpacing=6

# --- Textos (theme/strings.toml) ---------------------------------------------
# Los mismos que hyprlock salvo el de fallo: aquí no existe $ATTEMPTS, que lo
# resuelve hyprlock al dibujar y SDDM no tiene. Si se dejara, el greeter
# enseñaría la variable literal.
txtPlaceholder=Introduce la contraseña
txtFail=Contraseña incorrecta
txtVerifying=Comprobando…
