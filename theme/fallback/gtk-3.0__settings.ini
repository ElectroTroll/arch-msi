# settings.ini — PLANTILLA de la configuración de las aplicaciones GTK (arch-msi)
#
# Fuente:  dotfiles/matugen/.config/matugen/templates/gtk-settings.ini   (esto)
# Salidas: ~/.config/gtk-3.0/settings.ini                               (artefacto)
#          ~/.config/gtk-4.0/settings.ini                               (artefacto)
#
# ⚠️ NO EDITAR las salidas: las reescribe matugen en cada arranque. Se edita este
# archivo, o theme/tokens.toml para los valores.
#
# UNA PLANTILLA, DOS SALIDAS. GTK3 y GTK4 leen el MISMO formato en dos rutas
# distintas, y aquí todas las claves valen para los dos, así que declarar dos
# plantillas gemelas sería justo la duplicación que tokens.toml prohíbe. Lo que
# cambia entre versiones es qué HACE cada una con `gtk-theme-name`: GTK3 la
# obedece y carga adw-gtk3-dark; en GTK4 las apps de libadwaita la ignoran y se
# pintan con su propio tema, que sigue el `color-scheme` del portal. La clave se
# escribe en los dos por las apps GTK4 que NO usan libadwaita.
#
# HASTA EL 2026-09-16 ESTO ERA UN PAQUETE STOW (`dotfiles/gtk/`) con dos
# archivos literales. Pasó a plantilla en la tarea 3.5 porque el tema, los
# iconos y la fuente estaban a punto de quedar escritos en dos sitios —aquí y en
# el `gsettings` de theme-apply—, y tokens.toml declara que un valor repetido en
# la config de un componente es un error. Mismo camino que siguió style.css de
# Waybar en la 3.0.
#
# ⚠️ LO QUE ESTO NO CUBRE, y conviene no prometerlo. Firefox, Electron (VS Code,
# Obsidian, ZapZap), GTK4/libadwaita y Qt 6 NO leen este archivo: consultan
# `org.freedesktop.appearance color-scheme` en el portal, que sale de la clave
# gsettings que fija theme-apply. Esto cubre el resto: las apps GTK3, y los
# iconos, el cursor y la fuente de todas las GTK.
[Settings]
# Antes decía `Adwaita-dark`, un tema que NO EXISTE en este sistema: /usr/share/
# themes solo tenía Default y Emacs, y quien hacía el trabajo era la clave de
# abajo. Funcionaba, pero el nombre mentía. Desde la 3.5 hay un tema de verdad.
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1

# Los mismos iconos que ya usaba rofi desde la 3.2 (config.rasi). Eran la única
# incoherencia visible que quedaba: el menú con Papirus y los diálogos de
# archivos con Adwaita.
gtk-icon-theme-name=Tela-circle-arch-msi

gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=24

# La MISMA familia del escritorio, decisión del 2026-09-16. GTK quiere
# "Familia Tamaño" en una sola cadena, y el tamaño va en PUNTOS de Pango, que es
# justo la unidad de `size_base_pt` (la de dunst), no la de Waybar.
#
# ⚠️ ESTA LÍNEA SOLA NO BASTA, medido el 2026-09-16: con ella escrita,
# `gtk-query-settings` seguía devolviendo "Adwaita Sans 11", el default del
# esquema de GNOME, porque GTK3 toma la fuente de GSettings antes que de aquí.
# Quien la aplica de verdad es el `gsettings set font-name` de theme-apply. Se
# escribe igualmente para las sesiones sin dconf, donde este archivo es lo
# único que hay.
gtk-font-name=JetBrainsMono Nerd Font 10
